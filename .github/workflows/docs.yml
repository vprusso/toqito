name: Deploy Documentation

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "toqito/**"
      - ".github/workflows/docs.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to deploy as 'latest' (e.g. 1.1.8). Run the workflow from that version's tag so
          the built docs match the release. Leave empty to deploy only the dev docs.
        required: false
        default: ""

permissions:
  contents: write

# One deploy at a time. Docs Preview writes gh-pages too, but it runs in its
# own group: GitHub keeps a single pending run per group, so when a merge
# queued this workflow and the preview cleanup for the merged PR at the same
# time, the cleanup evicted the deploy and the dev docs were never updated.
# The push below retries instead if the preview workflow moved the branch.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install system dependencies for BLAS/LAPACK
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev liblapack-dev gfortran libatlas-base-dev

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies with uv
        run: uv sync --group docs

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # mike commits onto the local gh-pages branch and pushes. If Docs Preview
      # pushed first, drop the rejected commit, refetch and rebuild on top.
      - name: Define a retrying mike wrapper
        run: |
          cat > "$RUNNER_TEMP/mike-push.sh" <<'EOF'
          #!/usr/bin/env bash
          set -u
          for attempt in 1 2 3; do
            git fetch origin gh-pages
            git branch -f gh-pages origin/gh-pages
            if uv run mike "$@"; then
              exit 0
            fi
            echo "mike $* failed on attempt $attempt; retrying"
            sleep $((attempt * 20))
          done
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/mike-push.sh"

      - name: Deploy dev docs (push to master, or manual run without a version)
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.version == '')
        run: |
          cd docs
          "$RUNNER_TEMP/mike-push.sh" deploy --push dev

      - name: Deploy versioned docs (release, or manual run with a version)
        if: >-
          github.event_name == 'release' ||
          (github.event_name == 'workflow_dispatch' && inputs.version != '')
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="${{ inputs.version }}"
          fi
          VERSION=${VERSION#v}
          VERSION=${VERSION#.}
          cd docs
          "$RUNNER_TEMP/mike-push.sh" deploy --push --update-aliases "$VERSION" latest
          "$RUNNER_TEMP/mike-push.sh" set-default --push latest
